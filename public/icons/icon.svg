<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The app mark: a recording dot inside a ring, with a sound wave leaving
       it — the record button and what it hears. Flat green on the dark
       install surface, thick stroke, round caps — the same treatment as the
       sibling apps, so they read as one family on a home screen. Flat means
       flat: one fill, no gradient, no bevel.

       Geometry, in the 100 viewBox: a ring of radius 27 at (40, 50) stroked
       at 11, a filled dot of radius 10 at its centre, and two arcs centred
       at (60, 50) — radii 20 and 33 — over ±0.62 and ±0.68 radians. The
       same numbers are rasterised into the PNG install icons, the favicon
       and the social card by scripts/generate-icons.mjs (`npm run icons`)
       and mirrored in src/app/icons.tsx — the three are kept in step by
       hand. -->
  <rect width="100" height="100" rx="20" fill="#12101a" />
  <circle cx="40" cy="50" r="27" fill="none" stroke="#3ef07f" stroke-width="11" />
  <circle cx="40" cy="50" r="10" fill="#3ef07f" />
  <path
    d="M76.3 38.4 A20 20 0 0 1 76.3 61.6 M85.6 29.2 A33 33 0 0 1 85.6 70.8"
    fill="none"
    stroke="#3ef07f"
    stroke-width="11"
    stroke-linecap="round"
  />
</svg>
