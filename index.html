<!doctype html>
<!-- `data-theme` seeds the default preset before the app mounts (the engine
     then keeps it in sync); the framework's token blocks key off it. -->
<html lang="en" data-theme="githubDark">
  <head>
    <meta charset="UTF-8" />
    <!-- Lock the viewport scale: an installed PWA is an app, not a document.
         `maximum-scale=1, user-scalable=no` disables pinch-zoom and iOS's
         focus auto-zoom; `viewport-fit=cover` lets the app paint under the
         notch / home indicator (it pads with `env(safe-area-inset-*)`). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#12101a"
      media="(prefers-color-scheme: dark)"
    />
    <title>Recorder — voice memos</title>
    <meta
      name="description"
      content="Recorder is a local-first voice memo PWA. Record with a level meter and a spectrum analyser that show when the sound clips, keep recordings in folders and spaces, play them back, and export them as WAV, FLAC or MP3. Your recordings stay on your device, and sync to your own Dropbox, iCloud or storage server only if you connect one."
    />
    <!-- Not meant to be found: people find the App Store page and
         apps.agilator.se, not this web edition. -->
    <meta name="robots" content="noindex" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Recorder" />
    <meta
      property="og:description"
      content="A privacy-first voice recorder: a meter that shows clipping, folders and spaces, and WAV, FLAC or MP3 export. Your recordings stay yours."
    />
    <meta property="og:url" content="https://recorder.niclaslindstedt.se/" />
    <meta
      property="og:image"
      content="https://recorder.niclaslindstedt.se/og.png"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Recorder" />
    <meta
      name="twitter:description"
      content="A privacy-first voice recorder: a meter that shows clipping, folders and spaces, and WAV, FLAC or MP3 export. Your recordings stay yours."
    />
    <meta
      name="twitter:image"
      content="https://recorder.niclaslindstedt.se/og.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
